services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Embutida no bundle no build: mudou o valor, rode docker compose up --build
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8030/api}
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - jornada

# Rede criada pelo docker compose da jornada-capacitacao-api: suba o backend antes
networks:
  jornada:
    name: jornada-capacitacao-api_jornada
    external: true
